name: CI/CD Pipeline

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Linting..."

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: npm test

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f Dockerfile -t alex200189/node-app:${{ github.sha }} .

  docker-test:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -f Dockerfile.multi -t alex200189/node-app:${{ github.sha }} .
      
      - name: Run container
        run: |
          docker run -d -p 3000:3000 --name test-container alex200189/node-app:${{ github.sha }}
          sleep 3
      
      - name: Test endpoint
        run: curl http://localhost:3000
      
      - name: Stop container
        run: docker stop test-container && docker rm test-container 

  docker-push:
    needs: docker-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f Dockerfile -t alex200189/node-app:${{ github.sha }} .
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Tag image
        run: |
          docker tag alex200189/node-app:${{ github.sha }} alex200189/node-app:latest
          docker tag alex200189/node-app:${{ github.sha }} alex200189/node-app:v1.0.0
      - name: Push image
        run: |
          docker push alex200189/node-app:${{ github.sha }}
          docker push alex200189/node-app:latest
          docker push alex200189/node-app:v1.0.0
